    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ffffff;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* ===== Linh vat Agent — hien xuyen suot 0 -> 144.75s =====
         Dat o dai duoi cung (84.5%), vung ma moi canh deu de trong. */
      .mascot {
        position: absolute;
        left: 6%;
        top: 84.5%;
        width: 11.8%;
        aspect-ratio: 1;
      }
      .mascot-food { position: absolute; left: 18%; top: 6%; width: 64%; height: 64%; }
      .mascot-food svg { display: block; width: 100%; height: 100%; }
      /* laptop linh vat om truoc nguoi */
      .mascot-lap { position: absolute; left: 6%; top: 50%; width: 88%; height: 46%; }
      .mascot-lap svg { display: block; width: 100%; height: 100%; }
      .mascot-b { position: absolute; inset: 0; width: 100%; height: 100%; }
      .mascot-sh {
        position: absolute; left: 12%; right: 12%; top: 89%; height: 8%;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0.26) 0%, rgba(0,0,0,0) 70%);
      }
      /* ===== Lop glitch chuyen canh =====
         Ba dai ngang giat lech + mot nhay trang. Nam tren cung, khong chan chuot. */
      .glitch { position: absolute; inset: 0; pointer-events: none; }
      .gl-band { position: absolute; left: 0; right: 0; background: #1877f2; opacity: 0; }
      .gl-b1 { top: 17%; height: 7.5%; }
      .gl-b2 { top: 45%; height: 4.5%; }
      .gl-b3 { top: 69%; height: 9%; }
      .gl-flash { position: absolute; inset: 0; background: #ffffff; opacity: 0; }
      /* man chap may anh: hai la chan den sap vao giua roi mo ra */
      .shutter { position: absolute; inset: 0; pointer-events: none; }
      .sh-bar { position: absolute; left: 0; right: 0; height: 51%; background: #000000; }
      .sh-top { top: 0;    transform-origin: top center; }
      .sh-bot { bottom: 0; transform-origin: bottom center; }
      .sh-pop { position: absolute; inset: 0; background: #ffffff; opacity: 0; }
    </style>
  </head>
