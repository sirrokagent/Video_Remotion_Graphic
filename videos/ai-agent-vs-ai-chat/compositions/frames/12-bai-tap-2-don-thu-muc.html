    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        // Camera: mo dau hoi can, lui ra khi file rai khap khung, cuoi cung day xuong cum thu muc.
        gsap.set("#f12-cam", { scale: 1.15, x: 0, y: 0 });
        tl.fromTo("#f12-cam", { scale: 1.15, y: 0 },
          { scale: 1.0, y: 0, duration: 1.5, ease: "power2.inOut", immediateRender: false }, 2.40);
        tl.fromTo("#f12-cam", { scale: 1.0, y: 0 },
          { scale: 1.26, y: -125, duration: 1.3, ease: "power2.inOut", immediateRender: false }, 12.20);

        const field = document.querySelector("#root #f12-field");

        // 120 o file. Vi tri "lon xon" sinh bang cong thuc CO DINH theo index —
        // khong Math.random(), khong Date.now(). Cung mot index luon cho cung toa do.
        const N = 120;
        const W = 1080, H = 1920 * 0.83;
        const tiles = [];
        const bins = [
          { x: 0.125 * W, y: 0.74 * H },
          { x: 0.345 * W, y: 0.74 * H },
          { x: 0.565 * W, y: 0.74 * H },
          { x: 0.785 * W, y: 0.74 * H },
        ];

        for (let i = 0; i < N; i++) {
          const el = document.createElement("div");
          el.className = "f12-tile";
          el.id = "f12-t" + i;
          // icon file: to giay goc gap. Net ve bang currentColor, than giay trang.
          el.innerHTML =
            '<svg viewBox="0 0 14 18" aria-hidden="true">' +
            '<path d="M2.2 0.9H7.8L13.1 6.2V17.1a1 1 0 0 1-1 1H2.2a1 1 0 0 1-1-1V1.9a1 1 0 0 1 1-1Z"' +
            ' fill="#ffffff" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>' +
            '<path d="M7.8 0.9V5.2a1 1 0 0 0 1 1h4.3" fill="none" stroke="currentColor"' +
            ' stroke-width="1.35" stroke-linejoin="round"/>' +
            '</svg>';
          // scatter co dinh kieu R2 low-discrepancy: phan bo deu, khong tao van cheo.
          // Hoan toan deterministic — cung index luon cho cung toa do.
          const sx = (i * 0.7548776662) % 1;
          const sy = (i * 0.5698402909) % 1;
          const x0 = 0.07 * W + sx * 0.86 * W;
          const y0 = 0.16 * H + sy * 0.42 * H;
          const bin = bins[i % 4];
          // vi tri trong cum dich: luoi 6 cot
          const k = Math.floor(i / 4);
          const bx = bin.x + ((k % 6) - 2.5) * 28;
          const by = bin.y + Math.floor(k / 6) * 34 - 76;
          el.style.left = "0px";
          el.style.top = "0px";
          field.appendChild(el);
          tiles.push({ el: el, x0: x0, y0: y0, x1: bx, y1: by, wave: i % 4 });
        }

        gsap.set("#f12-lab2", { opacity: 0 });
        gsap.set("#f12-fill", { scaleX: 0 });
        gsap.set("#f12-track", { opacity: 0 });
        ["#f12-b0", "#f12-b1", "#f12-b2", "#f12-b3"].forEach(function (b) { gsap.set(b, { opacity: 0 }); });

        // Scene 1 (0–2.6s): nhan hien tren; khung duoi con trong.
        tl.fromTo("#f12-lab", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.475, ease: "power3.out" }, 0.095);

        // Scene 2 (2.6–6.0s): ~120 o xuat hien rai khap khung, waterfall-entry theo index.
        tiles.forEach(function (t, i) {
          tl.fromTo(
            t.el,
            { x: t.x0, y: t.y0 - 40, opacity: 0, scale: 0.7 },
            { x: t.x0, y: t.y0, opacity: 1, scale: 1, duration: 0.399, ease: "power3.out" , immediateRender: false }, 0.855 + i * 0.0247);
        });

        // Scene 3 (6.0–7.4s): 4 nhan duoi khung hien — dich den.
        ["#f12-b0", "#f12-b1", "#f12-b2", "#f12-b3"].forEach(function (b, i) {
          tl.fromTo(b, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.399, ease: "power3.out" }, 5.698 + i * 0.2089);
        });
        tl.fromTo("#f12-track", { opacity: 0 }, { opacity: 1, duration: 0.380, ease: "power2.out" }, 6.552);

        // Scene 4 (7.4–12.8s): cac o bay ve cum cua minh theo 4 dot.
        tiles.forEach(function (t, i) {
          const waveAt = 9.09 + t.wave * 0.95;
          const within = (Math.floor(i / 4) % 30) * 0.028;
          tl.fromTo(
            t.el,
            { x: t.x0, y: t.y0, borderColor: "#c3c7ce" },
            { x: t.x1, y: t.y1, borderColor: "#1877f2", duration: 0.874, ease: "power3.inOut" },
            waveAt + within
          );
        });

        // Thanh tien trinh chay dong bo voi so o da ve.
        tl.fromTo("#f12-fill", { scaleX: 0 }, { scaleX: 1, duration: 4.0, ease: "power1.inOut" }, 9.09);

        // Scene 5 (12.8–14.6s): o cuoi ve cho, thanh tien trinh day.
        tl.fromTo("#f12-fill", { opacity: 1 }, { opacity: 1, duration: 0.285, ease: "none" , immediateRender: false }, 13.10);

        // Scene 6 (14.6–16.27s): nhan doi thanh "tu phan loai", toan khung giu tinh.
        tl.fromTo("#f12-lab",  { opacity: 1 }, { opacity: 0, duration: 0.323, ease: "power2.in" , immediateRender: false }, 13.674);
        tl.fromTo("#f12-lab2", { opacity: 0 }, { opacity: 1, duration: 0.437, ease: "power3.out" }, 13.883);

        window.__timelines = window.__timelines || {};
        window.__timelines["12-bai-tap-2-don-thu-muc"] = tl;
        tl.seek(0);
      })();
