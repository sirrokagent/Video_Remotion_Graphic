        gsap.set(f01B, { transformOrigin: "50% 91%" });
        gsap.set(f01S, { transformOrigin: "50% 50%", opacity: 0 });  // bong phai an cho den khi than vao
        function f01In(at) {

          tl.fromTo(f01B, { scaleX: 0.90, scaleY: 1.14 }, { scaleX: 1.12, scaleY: 0.88, duration: 0.26, ease: "power2.in",  immediateRender: false }, at + 0.44);
          tl.fromTo(f01B, { scaleX: 1.12, scaleY: 0.88 }, { scaleX: 1, scaleY: 1, duration: 0.44, ease: "elastic.out(1,0.45)", immediateRender: false }, at + 0.70);

          tl.fromTo(f01S, { scaleX: 0.55, opacity: 0.38 }, { scaleX: 1, opacity: 1, duration: 0.26, ease: "power2.in", immediateRender: false }, at + 0.44);
        }
        function f01Happy(at) {
          [0, 0.36].forEach(function (d) {
            tl.fromTo(f01B, { y: 0, scaleY: 1 },      { y: -30, scaleY: 1.07, duration: 0.18, ease: "power2.out", immediateRender: false }, at + d);
            tl.fromTo(f01B, { y: -30, scaleY: 1.07 }, { y: 0, scaleY: 0.94, duration: 0.18, ease: "power2.in",  immediateRender: false }, at + d + 0.18);
          });
          tl.fromTo(f01B, { scaleY: 0.94 }, { scaleY: 1, duration: 0.26, ease: "power2.out", immediateRender: false }, at + 0.72);
          tl.fromTo(f01B, { rotation: 0 },  { rotation: -8, duration: 0.19, ease: "power2.out",   immediateRender: false }, at + 0.74);
          tl.fromTo(f01B, { rotation: -8 }, { rotation: 7,  duration: 0.27, ease: "power1.inOut", immediateRender: false }, at + 0.93);
          tl.fromTo(f01B, { rotation: 7 },  { rotation: 0,  duration: 0.34, ease: "elastic.out(1,0.5)", immediateRender: false }, at + 1.20);
        }
        function f01Float(at, n) {
          for (var i = 0; i < n; i++) {
            tl.fromTo(f01B, { y: 0 },   { y: -16, duration: 0.66, ease: "sine.inOut", immediateRender: false }, at + i * 1.32);
            tl.fromTo(f01B, { y: -16 }, { y: 0,   duration: 0.66, ease: "sine.inOut", immediateRender: false }, at + i * 1.32 + 0.66);

        }
        function f01Blink(at) {
          ["#f01-lid1", "#f01-lid2"].forEach(function (l) {
            tl.fromTo(l, { scaleY: 1 },    { scaleY: 0.06, duration: 0.09, ease: "power2.in",  immediateRender: false }, at);
            tl.fromTo(l, { scaleY: 0.06 }, { scaleY: 1,    duration: 0.12, ease: "power2.out", immediateRender: false }, at + 0.09);

        gsap.set("#f01-rule", { scaleX: 0 });

        gsap.set("#f01-agent", { opacity: 0 });

        tl.fromTo("#f01-dot", { scale: 0 }, { scale: 1, duration: 0.34, ease: "back.out(2.2)" }, 0.10);
        tl.fromTo("#f01-brand", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.26);
        tl.fromTo("#f01-toprule", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 0.40);

        // Nhip giua, bam dung loi doc (do bang silencedetect tren vo-01.mp3):

        //   1.27–3.80s "De thuc su buoc vao THE GIOI CUA AI AGENT"

                                { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, 0.30);
        tl.to("#f01-hello", { opacity: 0, y: -20, duration: 0.32, ease: "power2.in" }, 2.30);

        f01Blink(4.70);
        // nhuong cho tieu de: dong dan tat truoc khi chu vao
        tl.to("#f01-lead", { opacity: 0, y: -14, duration: 0.3, ease: "power2.in" }, 4.00);

        // Tieu de chiem nua duoi tu 4.22s — nhac hang avatar len truoc do.
        tl.fromTo("#f01-agentrow", { y: 0 },
                                   { y: -380, duration: 0.52, ease: "power3.inOut" }, 4.05);

          tl.fromTo(b + " .v", { scaleY: 0 }, { scaleY: 1, duration: 0.38, ease: "power3.out" }, 4.40 + i * 0.14);
        });

        // Scene 4 (3.4–4.3s): hairline xanh ve duoi chan chu.
        tl.fromTo("#f01-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "power3.out" }, 4.60);

        // Scene 5 (4.3–5.0s): giu tinh, jitter bien do rat thap tren cum chu.
