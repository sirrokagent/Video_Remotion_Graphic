          tl.fromTo(f06B, { scaleX: 0.90, scaleY: 1.14 }, { scaleX: 1.12, scaleY: 0.88, duration: 0.26, ease: "power2.in",  immediateRender: false }, at + 0.44);

          tl.fromTo(f06S, { scaleX: 0.55, opacity: 0.38 }, { scaleX: 1, opacity: 1, duration: 0.26, ease: "power2.in", immediateRender: false }, at + 0.44);
        }
        function f06Happy(at) {
          [0, 0.36].forEach(function (d) {
            tl.fromTo(f06B, { y: 0, scaleY: 1 },      { y: -30, scaleY: 1.07, duration: 0.18, ease: "power2.out", immediateRender: false }, at + d);
            tl.fromTo(f06B, { y: -30, scaleY: 1.07 }, { y: 0, scaleY: 0.94, duration: 0.18, ease: "power2.in",  immediateRender: false }, at + d + 0.18);
          });
          tl.fromTo(f06B, { scaleY: 0.94 }, { scaleY: 1, duration: 0.26, ease: "power2.out", immediateRender: false }, at + 0.72);
          tl.fromTo(f06B, { rotation: 0 },  { rotation: -8, duration: 0.19, ease: "power2.out",   immediateRender: false }, at + 0.74);
          tl.fromTo(f06B, { rotation: -8 }, { rotation: 7,  duration: 0.27, ease: "power1.inOut", immediateRender: false }, at + 0.93);
          tl.fromTo(f06B, { rotation: 7 },  { rotation: 0,  duration: 0.34, ease: "elastic.out(1,0.5)", immediateRender: false }, at + 1.20);
        }
        function f06Float(at, n) {
          for (var i = 0; i < n; i++) {
            tl.fromTo(f06B, { y: 0 },   { y: -16, duration: 0.66, ease: "sine.inOut", immediateRender: false }, at + i * 1.32);
            tl.fromTo(f06B, { y: -16 }, { y: 0,   duration: 0.66, ease: "sine.inOut", immediateRender: false }, at + i * 1.32 + 0.66);
          }

        function f06Blink(at) {
          ["#f06-lid1", "#f06-lid2"].forEach(function (l) {
            tl.fromTo(l, { scaleY: 1 },    { scaleY: 0.06, duration: 0.09, ease: "power2.in",  immediateRender: false }, at);
            tl.fromTo(l, { scaleY: 0.06 }, { scaleY: 1,    duration: 0.12, ease: "power2.out", immediateRender: false }, at + 0.09);
          });
