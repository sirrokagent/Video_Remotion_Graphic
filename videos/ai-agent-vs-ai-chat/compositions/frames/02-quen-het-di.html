      @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/plexmono-500-latin.woff2") format("woff2"); font-weight: 500; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

      #root { width:100%; height:100%; position:relative; container-type:inline-size; font-family:"Google Sans Flex",sans-serif; }

      .f02-ground {
        position:absolute; inset:0;
        background:
          radial-gradient(circle at center, rgba(255,255,255,0.13) 1.25px, transparent 1.35px) 0 0 / 34px 34px,
          #000000;
      }
      .f02-stage { position:absolute; left:0; right:0; top:12%; height:71%; }

      /* luoi "kien thuc cu" — cac khoi xep ngay ngan roi vo vun */
      .f02-grid {
        position:absolute; left:8cqw; right:8cqw; top:22%;
        display:flex; flex-wrap:wrap; gap:1.08cqw; justify-content:center;
      }
      .f02-cell {
        width:4.19cqw; height:2.03cqw; border-radius:0.25cqw;
        border:1px solid rgba(255,255,255,0.28); background:rgba(255,255,255,0.10);
      }
      .f02-gridlab {
        position:absolute; left:8cqw; right:8cqw; top:18%;
        text-align:center;
        font-family:"IBM Plex Mono",monospace; font-size:1.70cqw; font-weight:500;
        letter-spacing:0.14em; text-transform:uppercase; color:#ffffff;
      }

      .f02-hero {
        position:absolute; left:0; right:0; top:44%;
        text-align:center;
        font-size:22.10cqw; font-weight:900; line-height:0.88;
        letter-spacing:-0.04em; color:#ffffff;
        text-transform:lowercase; white-space:nowrap;
      }
      .f02-char { display:inline-block; }

      .f02-after {
        position:absolute; left:0; right:0; top:50%;
        text-align:center;
        font-size:7.65cqw; font-weight:700; line-height:1.1;
        letter-spacing:-0.02em; color:#8fc2ff;
        text-transform:lowercase; white-space:nowrap;
      }
    </style>

    <div id="f02-ground" class="clip f02-ground" data-start="0" data-duration="6.8" data-track-index="0"></div>

    <div id="f02-stage" class="clip f02-stage" data-start="0" data-duration="6.8" data-track-index="1">
      <div class="f02-gridlab" id="f02-gridlab">những gì bạn đã biết về ai</div>
      <div class="f02-grid" id="f02-grid"></div>

      <div class="f02-hero" id="f02-hero"><span class="f02-char">q</span><span class="f02-char">u</span><span class="f02-char">ê</span><span class="f02-char">n</span><span class="f02-char">&nbsp;</span><span class="f02-char">h</span><span class="f02-char">ế</span><span class="f02-char">t</span></div>
      <div class="f02-after" id="f02-after">phế bỏ võ công</div>
    </div>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        const chars = gsap.utils.toArray("#root .f02-char");
        const gridBox = document.querySelector("#root #f02-grid");

        // 36 khoi kien thuc cu, xep thanh luoi deu — hoan toan co dinh.
        const cells = [];
        for (let i = 0; i < 36; i++) {
          const el = document.createElement("div");
          el.className = "f02-cell";
          el.id = "f02-c" + i;
          gridBox.appendChild(el);
          cells.push(el);
        }

        gsap.set("#f02-after", { opacity: 0 });
        cells.forEach(function (c) { gsap.set(c, { opacity: 0, y: -14 }); });

        // Scene 1 (0.1–1.4s): luoi kien thuc cu xep vao, ngay ngan va vo hon.
        tl.fromTo("#f02-gridlab", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.10);
        cells.forEach(function (c, i) {
          tl.fromTo(c, { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 0.22 + i * 0.016);
        });

        // Scene 2 (1.1–2.6s): "quen het" beat-slam dap vao giua luoi.
        tl.fromTo("#f02-hero", { scale: 1.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.63, ease: "power4.out" }, 1.10);

        // Scene 3 (2.6–3.6s): giu nguyen, de cu dap ngam.

        // Scene 4 (3.6–5.0s): luoi vo truoc, roi den tung ky tu — ca hai cung roi khoi khung.
        cells.forEach(function (c, i) {
          const drift = ((i % 5) - 2) * 7;
          tl.fromTo(c, { y: 0, rotate: 0, opacity: 1 },
                       { y: 760, rotate: drift, opacity: 0, duration: 0.8, ease: "power2.in", immediateRender: false },
                       4.05 + (i % 9) * 0.03);
        });
        tl.fromTo("#f02-gridlab", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 4.05);

        chars.forEach(function (ch, i) {
          const drift = ((i % 3) - 1) * 1.1;
          tl.fromTo(ch, { yPercent: 0, rotate: 0, opacity: 1 },
                        { yPercent: 170, rotate: drift * 6, opacity: 0, duration: 0.74, ease: "power2.in" },
                        4.40 + i * 0.056);
        });

        // Scene 5 (5.0–6.30s): dong xanh spring-pop vao cho vua trong, roi giu tinh.
        tl.fromTo("#f02-after", { scale: 0.86, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.76, ease: "back.out(1.5)" }, 5.34);

        window.__timelines = window.__timelines || {};
        window.__timelines["02-quen-het-di"] = tl;
        tl.seek(0);
      })();
    </script>
