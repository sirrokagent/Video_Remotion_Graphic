    <script>
      (function () {
        "use strict";
        var q = function (s) { return document.querySelector("#root " + s); };
        var qa = function (s) { return document.querySelectorAll("#root " + s); };

        // ── voice wave: 24 bars on a FIXED envelope. Closed-form from the bar index and
        // the step index, so every seek reproduces the same bar heights exactly.
        var BARS = 24, STEPS = 11;
        var wave = q(".f05-wave");
        for (var b = 0; b < BARS; b++) wave.appendChild(document.createElement("i"));
        var bars = qa(".f05-wave i");

        function env(i, k) {
          var a = Math.abs(Math.sin(i * 0.77 + k * 1.31));
          var c = Math.abs(Math.cos(i * 0.41 - k * 0.83));
          var edge = 0.45 + 0.55 * Math.sin((Math.PI * (i + 0.5)) / BARS); // quieter at the ends
          return Number((0.14 + 0.86 * (0.62 * a + 0.38 * c) * edge).toFixed(4));
        }

        var tasks = qa(".f05-task");
        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-0.7) — handoff_in: the mark arrives from frame 04 at (960,470)
        // scale 1.0 and flies into the sidebar avatar at (330,300) scale 0.22.
        tl.fromTo(q(".f05-mark"),
          { x: 812, y: 287, scale: 4.545, opacity: 1 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.62, ease: "power3.inOut" }, 0);
        tl.fromTo(q(".f05-win"),
          { opacity: 0, scale: 0.97 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.06);

        // Scene 2 (0.7-2.0) — "Bạn nói": the wave ignites. This is the frame's whole claim,
        // so it is a live reacting waveform, never a static microphone glyph.
        tl.fromTo(bars,
          { scaleY: 0.06, opacity: 0 },
          { scaleY: env(0, 0), opacity: 1, duration: 0.26, ease: "power2.out", stagger: 0.012 }, 0.7);
        for (var i = 0; i < BARS; i++) {
          var kf = [];
          for (var k = 1; k < STEPS; k++) kf.push({ scaleY: env(i, k), duration: 0.5 });
          tl.to(bars[i], { keyframes: kf, ease: "power1.inOut" }, 0.98);
        }
        // the wave drops to an idle register once the machine takes over, but never dies
        tl.to(bars, { scaleY: 0.16, duration: 0.7, ease: "power2.out", stagger: 0.008 }, 6.0);

        // Scene 3 (2.0-3.1) — "Nó nghe": the sidebar roster wakes, one agent at a time.
        tl.fromTo(qa(".f05-ag"),
          { opacity: 0.35, x: -16 },
          { opacity: 1, x: 0, duration: 0.34, ease: "power3.out", stagger: 0.2 }, 2.02);

        // Scene 4 (3.1-4.2) — "nó chia việc": four task rows cascade in, none ticked yet.
        tl.fromTo(tasks,
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power3.out", stagger: 0.17 }, 3.1);

        // Scene 5 (4.2-6.0) — "rồi nó làm xong": rows 1 and 2 check off; the check draws
        // itself and its ring pops. Row 3's progress starts filling.
        [0, 1].forEach(function (n, idx) {
          var at = 4.24 + idx * 0.62;
          var path = tasks[n].querySelector("svg path");
          tl.fromTo(path,
            { strokeDasharray: 34, strokeDashoffset: 34 },
            { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" }, at);
          tl.fromTo(tasks[n].querySelector(".ring"),
            { opacity: 0.9, scale: 0.7 },
            { opacity: 0, scale: 1.45, duration: 0.42, ease: "power2.out" }, at);
          tl.to(tasks[n], { color: "#6E6E76", duration: 0.3 }, at + 0.1);
          // the status chip must not claim "xong" before the tick lands
          tl.fromTo(tasks[n].querySelector(".st .a"),
            { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power2.in" }, at);
          tl.fromTo(tasks[n].querySelector(".st .b"),
            { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, at + 0.15);
        });
        tl.fromTo(q(".f05-prog"),
          { width: "0%" }, { width: "64%", duration: 1.5, ease: "power2.out" }, 4.9);

        // Scene 6 (6.0-8.2) — "và trả lại kết quả": row 3 lands, row 4 stays honestly queued
        // (the agent is still working), then the frame holds for the last 0.3s.
        var p3 = tasks[2].querySelector("svg path");
        tl.fromTo(p3,
          { strokeDasharray: 34, strokeDashoffset: 34 },
          { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" }, 6.42);
        tl.fromTo(tasks[2].querySelector(".ring"),
          { opacity: 0.9, scale: 0.7 },
          { opacity: 0, scale: 1.45, duration: 0.42, ease: "power2.out" }, 6.42);
        tl.to(q(".f05-prog"), { width: "100%", duration: 0.4, ease: "power2.out" }, 6.42);
        tl.to(tasks[2], { color: "#6E6E76", duration: 0.3 }, 6.52);
        tl.fromTo(tasks[2].querySelector(".st .a"),
          { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power2.in" }, 6.42);
        tl.fromTo(tasks[2].querySelector(".st .b"),
          { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 6.57);

        window.__timelines = window.__timelines || {};
        window.__timelines["05-ban-noi-no-lam"] = tl;
        tl.seek(0);
      })();
