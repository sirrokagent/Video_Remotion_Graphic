    <script>
      (function () {
        "use strict";
        var q = function (s) { return document.querySelector("#root " + s); };
        var qa = function (s) { return document.querySelectorAll("#root " + s); };

        var cards = qa(".f02-card");
        var ghosts = qa(".f02-ghost");
        var all = [].slice.call(cards).concat([].slice.call(ghosts));

        // Each card enters from outside the frame along its own axis, so the
        // arrival direction matches where it finally sits. Fixed table, no random.
        var fromOffset = [
          [-440, -200], [440, -210], [-420, 215], [430, 205],
          [-120, -330], [120, -330], [-120, 330], [120, 330],
          [-480, -40], [480, -40], [0, -360], [0, 360]
        ];

        var tl = gsap.timeline({ paused: true });

        // handoff_in (0.0-0.5) — the mark continues in from frame 01 at scale 1 / opacity 1,
        // then shrinks to 0.35 and clears so the pain can own the centre.
        tl.fromTo(q(".f02-mark"),
          { opacity: 1, scale: 1 },
          { opacity: 0, scale: 0.35, duration: 0.5, ease: "power2.in" }, 0);

        // Scene 1 (0.0-0.5) — the viewer lands dead centre and stays still all frame.
        tl.fromTo(q(".f02-centre"),
          { opacity: 0, scale: 0.9 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.28);

        // Scene 2 (0.5-3.0) — one named card per spoken name, spring-pop off the frame edge.
        var cardCue = [0.55, 1.18, 1.78, 2.38];
        for (var i = 0; i < cards.length; i++) {
          tl.fromTo(cards[i],
            { opacity: 0, x: fromOffset[i][0], y: fromOffset[i][1], scale: 0.82 },
            { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.62, ease: "back.out(1.25)" },
            cardCue[i]);
          tl.fromTo(cards[i].querySelector(".p"),
            { opacity: 0, scale: 0.7 },
            { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" },
            cardCue[i] + 0.14);
        }

        // Scene 3 (3.0-4.6) — the eight unlabelled cards cascade in and the density rises.
        for (var g = 0; g < ghosts.length; g++) {
          tl.fromTo(ghosts[g],
            { opacity: 0, x: fromOffset[4 + g][0], y: fromOffset[4 + g][1], scale: 0.8 },
            { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
            3.04 + g * 0.145);
        }

        // Scene 4 (4.6-6.9) — SIGNATURE MOVE: every card closes IN on the centre from all
        // sides (surround, not zoom), the outer ring softening so the viewer stays focal.
        // Freezes at its densest for the last 0.4s.
        tl.to(all, {
          x: function (i, el) { return Number(el.getAttribute("data-dx")); },
          y: function (i, el) { return Number(el.getAttribute("data-dy")); },
          duration: 1.9, ease: "power2.inOut"
        }, 4.58);
        tl.to(ghosts, { filter: "blur(3.4px)", duration: 1.5, ease: "power2.inOut" }, 4.58);

        window.__timelines = window.__timelines || {};
        window.__timelines["02-moi-dau-viec-mot-nguoi"] = tl;
        tl.seek(0);
