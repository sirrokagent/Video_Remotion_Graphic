        // The twelve pieces are the role cards from frame 02, carried over as the raw

          [19, 365, 150, 78], [1731, 403, 150, 78], [883, 10, 150, 78], [883, 845, 150, 78]
        ];
        var TARGET_X = 960, TARGET_Y = 470;

        for (var i = 0; i < START.length; i++) {
          var p = document.createElement("div");
          p.className = "f04-piece";
          p.setAttribute("data-layout-allow-overflow", "");
          p.style.left = START[i][0] + "px";
          p.style.top = START[i][1] + "px";
          p.style.width = START[i][2] + "px";
          p.style.height = START[i][3] + "px";
          p.setAttribute("data-tx", TARGET_X - (START[i][0] + START[i][2] / 2));
          p.setAttribute("data-ty", TARGET_Y - (START[i][1] + START[i][3] / 2));
          layer.appendChild(p);
        }
        var pieces = document.querySelectorAll("#root .f04-piece");

        var word = q(".f04-word");
        word.innerHTML = '<span>Sirrok</span> <span>Agent</span>';
        var wordParts = word.querySelectorAll("span");

        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-1.3) — SIGNATURE MOVE: piece-by-piece assembly. The twelve pieces

        // Inner pieces arrive first so the mark reads as filling from the middle out.

          {
            opacity: 0, scale: 0.06, filter: "blur(5px)",
            x: function (i, el) { return Number(el.getAttribute("data-tx")); },
            y: function (i, el) { return Number(el.getAttribute("data-ty")); },
